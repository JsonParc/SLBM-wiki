<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 680 256" role="img" aria-labelledby="title desc">
  <title id="title">SLBM clan logo</title>
  <desc id="desc">Metallic gold SLBM lettering with a rising rocket trail.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fff0b6"/>
      <stop offset="0.22" stop-color="#e3c36d"/>
      <stop offset="0.52" stop-color="#a77a29"/>
      <stop offset="0.76" stop-color="#f0d789"/>
      <stop offset="1" stop-color="#99702b"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="url(#gold)" stroke="#8e6b2e" stroke-width="1.5" paint-order="stroke" filter="url(#lift)">
    <text x="32" y="222" font-family="Baskerville, Georgia, 'Times New Roman', serif" font-size="210" font-style="italic" font-weight="700" letter-spacing="-10">SLBM</text>
  </g>
  <path d="M300 218 C334 143 370 80 435 38 C462 21 482 13 505 8" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M496 10 L535 0 L513 35 L506 23 L492 28 Z" fill="url(#gold)" stroke="#8e6b2e" stroke-width="1.5"/>
</svg>