  <text x="128" y="185" text-anchor="middle" fill="url(#gold)" stroke="#8e6b2e" stroke-width="1" paint-order="stroke" font-family="Baskerville, Georgia, 'Times New Roman', serif" font-size="166" font-style="italic" font-weight="700">S</text>
